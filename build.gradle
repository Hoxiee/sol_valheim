plugins {
    id "architectury-plugin" version "${arch_plugin_version}"
    id "dev.architectury.loom" version "${loom_version}" apply false
    id "io.github.pacifistmc.forgix" version "${forgix_version}"
    id "me.modmuss50.mod-publish-plugin" version "0.3.4" apply false // https://github.com/modmuss50/mod-publish-plugin
}

// These are the access wideners depending on the minecraft version
def mcVersionToAccessWidenerVersion = [
        "1.19.2": "1_19_2",
        "1.20.1": "1_20_1",
        "1.21.1": "1_21_1",
]
ext.set("access_wideners", mcVersionToAccessWidenerVersion)

loadProperties()
makeAccessWidener()
defineMixins()

forgix {
    destinationDirectory = layout.projectDirectory.dir("build/libs/merged")
    archiveVersion = "${modid}-${mod_version}${getBuildNumber()}+mc${minecraft_version}"
    silence = true

    // forge is only a target while it still exists: Architectury API ships no Forge builds past 1.20.x
    if (minecraft_version >= "1.21") {
        fabric()
        neoforge()
    } else {
        fabric()
        forge()
    }
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    // :forge only exists on targets that still ship it
    def forgeProject = findProject(":forge")
    def isForge = forgeProject != null && it == forgeProject
    def isFabric = it == project(":fabric")
    def isCommon = it == project(":common")

    def awFile = project(":common").file("src/main/resources/${modid}.accesswidener")

    loom {
        silentMojangMappingsLicense()

        if(awFile.exists()) {
            accessWidenerPath = awFile

            if(isForge) {
                forge {
                    convertAccessWideners = true
                    extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

                }
            }
        }

        runs {
            remove server
        }

        runs.configureEach {
            vmArg("-Dmixin.debug.export=true")
            vmArg("-Dmixin.env.remapRefMap=true")
            vmArg("-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg")
        }
    }

    configurations {
        addJar
        shade

        addJarCompile
        addJarRuntime
        addJarEverywhere
    }

    // named() lookups: newer Gradle resolves bare configuration names to providers inside this block
    if (!isCommon) {
        configurations.named("include") { it.extendsFrom(configurations.addJar) }
    }
    if (isForge) {
        configurations.named("forgeRuntimeLibrary") { it.extendsFrom(configurations.addJar) }
    }
    configurations.named("compileOnly") { it.extendsFrom(configurations.addJarCompile) }
    configurations.named("annotationProcessor") { it.extendsFrom(configurations.addJarCompile) }
    configurations.named("implementation") { it.extendsFrom(configurations.addJarRuntime) }
    configurations.named("api") { it.extendsFrom(configurations.addJarEverywhere) }
    configurations.named("addJar") {
        it.extendsFrom(configurations.addJarCompile)
        it.extendsFrom(configurations.addJarRuntime)
        it.extendsFrom(configurations.addJarEverywhere)
    }
    configurations.named("implementation") { it.extendsFrom(configurations.shade) }

    repositories {
        mavenCentral()
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://maven.quiltmc.org/repository/release" }
        maven { url = "https://maven.neoforged.net/releases" } // NeoForge
        maven {
            url "https://maven.tterrag.com/"
            content {
                includeGroup("com.jozufozu.flywheel")
                includeGroup("com.tterrag.registrate")
                includeGroup("com.simibubi.create")
            }
        }
        maven { // modrinth
            url "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven { // curseforge
            url "https://www.cursemaven.com"
            content { includeGroup "curse.maven" }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings(loom.layered {
            // quilt mappings stopped tracking new versions - newer targets run mojmap + parchment only
            if (rootProject.hasProperty("quilt") && rootProject.quilt?.trim()) {
                it.mappings("org.quiltmc:quilt-mappings:${rootProject.minecraft_version}+build.${rootProject.quilt}:intermediary-v2")
            }
            // No parchment: its layer corrupts the composed mappings on every loom this build can use
            // (1.10/1.14/1.17) - the official column comes out holding mojmap names instead of the
            // obfuscated ones, so nothing in the game jar gets remapped and every net.minecraft class
            // fails to resolve. Class/method/field names come from officialMojangMappings() either
            // way; only parameter names inside vanilla sources are lost. Re-add once loom is fixed.
            it.officialMojangMappings()
        })

        annotationProcessor "systems.manifold:manifold-preprocessor:${rootProject.manifold_version}"

        if (isFabric) {
            modImplementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}")
            // optional runtime-only test mods; not every target ships curse.maven pins for these
            if (rootProject.findProperty("fabric_farmers_delight"))
                modRuntimeOnly("curse.maven:farmers-delight-fabric-482834:${rootProject.fabric_farmers_delight}")
            if (rootProject.findProperty("fabric_rei"))
                modRuntimeOnly("curse.maven:rei-fabric-310111:${rootProject.fabric_rei}")
            if (rootProject.findProperty("carpet"))
                modRuntimeOnly("curse.maven:carpet-349239:${rootProject.carpet}")
        }

        if (isForge) {
            modImplementation("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}")
            if (rootProject.findProperty("farmers_delight"))
                modRuntimeOnly("curse.maven:farmers-delight-398521:${rootProject.farmers_delight}")
            if (rootProject.findProperty("rei"))
                modRuntimeOnly("curse.maven:rei-310111:${rootProject.rei}")
        }
    }

    processResources {
        def properties = [
                id               : modid,
                aw	 			 : access_widener,
                version          : mod_version,
                minecraft_version: minecraft_version,
                display_name     : display_name
        ]

        // per-loader keys exist only on the targets that still ship that loader
        if (rootProject.hasProperty("forge"))
            properties.put("forge", forge.split("\\.")[0])
        if (rootProject.hasProperty("neoforge"))
            properties.put("neoforge", neoforge)
        if (rootProject.hasProperty("fabric")) {
            properties.put("fabric", fabric)
            properties.put("fabric_api", fabric_api)
        }

        inputs.properties properties

        filesMatching("architectury.common.json") {
            expand properties
        }

        filesMatching("fabric.mod.json") {
            expand properties
        }

        filesMatching("META-INF/mods.toml") {
            expand properties
        }

        filesMatching("META-INF/neoforge.mods.toml") {
            expand properties
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    // Gradle 9 replaced the archivesBaseName property with base.archivesName
    base {
        archivesName = rootProject.modid
    }
    version = rootProject.mod_version + getBuildNumber()
    group = rootProject.maven_group

    repositories {
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' } // manifold
        maven { url 'https://jitpack.io' } // idk a lot of stuff
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        // 1.20.5+ runs on Java 21; older targets stay on the 17 bytecode they shipped with
        options.release = rootProject.minecraft_version >= "1.21" ? 21 : 17
        options.compilerArgs += ['-Xplugin:Manifold']
    }

    java {
        withSourcesJar()
    }
}

static def getBuildNumber() {
    String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
    return (buildNumber != null ? "-${buildNumber}" : "")
}


/* Cursed stuff is defined below! Beware of dog */



// Defines the preprocessors
def setupManifoldProcessors(List<String> mcVers, int mcIndex) {
    def redefineList = new ArrayList<String>()
    for (int i = 0; i < mcVers.size(); i++) {
        String mcStr = "MC_" + mcVers.get(i).replace(".", "_")

        if (mcIndex < i)
            redefineList.add("PRE_$mcStr")

        if (mcIndex <= i)
            redefineList.add("PRE_CURRENT_$mcStr")

        if (mcIndex == i)
            redefineList.add(mcStr)

        if (mcIndex > i)
            redefineList.add("POST_$mcStr")

        if (mcIndex >= i)
            redefineList.add("POST_CURRENT_$mcStr")
    }

    StringBuilder sb = new StringBuilder()
            .append("# DO NOT EDIT\n")
            .append("# Generated by the build script. Change mcVer property to change minecraft version.\n\n")

    for (String redefinedVersion : redefineList) {
        sb.append(redefinedVersion).append("=\n")
    }

    new File(projectDir, "build.properties").text = sb.toString()
}

// Loads the properties for each version & sets up the preprocessors
def loadProperties() {
    def mcVersion = ""
    def mcVers = mc_versions.split(", ")
    int mcIndex = -1

    println "Avalible Minecraft Versions: ${mc_versions}"

    if (project.hasProperty("mcVer")) {
        mcVersion = mcVer
        mcIndex = Arrays.asList(mcVers).indexOf(mcVer)
    }

    if (mcIndex == -1) {
        println "Defaulting to ${rootProject.default_mc_version} since the set mcVer is invalid."
        println "Use -PmcVer='${rootProject.default_mc_version}' or edit gradle.properties to set the minecraft version."

        mcVersion = default_mc_version
        mcIndex = Arrays.asList(mcVers).indexOf(default_mc_version)
    }

    println "Using " + mcVersion + ".properties."
    def properties = new Properties()

    properties.load(new FileInputStream("$rootProject.rootDir/"+"$mcVersion"+".properties"))

    properties.each { property ->
        rootProject.ext.set(property.key, property.value)
    }

    setupManifoldProcessors(Arrays.asList(mcVers), mcIndex)

    rootProject.ext.set("access_widener_version", rootProject.access_wideners.get(mcVersion))
}

// Sets up the accesswideners
def makeAccessWidener() {
    def accessWidenerFile = project(":common").file("src/main/resources/${modid}.accesswidener")
    def versionAccessWidenerFile = project(":common").file("src/main/resources/${rootProject.access_widener_version}.${modid}.aw")

    if (accessWidenerFile.exists()) {
        delete accessWidenerFile
    }

    if (versionAccessWidenerFile.exists()) {
        copy {
            from versionAccessWidenerFile
            into project(":common").file("src/main/resources/")
            rename "${rootProject.access_widener_version}.${modid}.aw", "${modid}.accesswidener"
        }
        def text = accessWidenerFile.text
        text += "\n# DO NOT EDIT\n# Generated by the build script. Edit ${versionAccessWidenerFile.name} instead!"

        accessWidenerFile.text = text
    } else {
        versionAccessWidenerFile.createNewFile()
        versionAccessWidenerFile.text = "accessWidener   v2  named"
    }
    rootProject.ext.set("access_widener", "${rootProject.access_widener_version}.${modid}.aw")
}

// Defines the mixins
def defineMixins() {
    def mixins = new ArrayList<String>()
    def projects = new ArrayList<String>()

    for (Project proj : rootProject.subprojects) {
        projects.add(proj.name)
    }

    for (String proj : projects) {
        for (File file : project(proj).file("src/main/resources/").listFiles()) {
            if (file.getName().endsWith("mixin.json") || file.getName().endsWith("mixins.json")) {
                mixins.add(file.getName())
            }
        }
    }

    rootProject.ext.set("mixins", mixins)
}
